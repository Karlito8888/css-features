<div class="card">
  <svg viewBox="0 0 280 150" role="img" aria-label="The text Ag chip pq with a small word placed on a dashed horizontal line">
    <line class="baseline" x1="0" y1="85" x2="280" y2="85" />
    <text x="140" y="85">Ag <tspan id="example-element">chip</tspan> pq</text>
  </svg>
  <p class="note">The big letters sit on the dashed baseline. alignment-baseline moves only the small word, a tspan, against the baseline of its parent text. Chrome applies it to SVG text only, so this example is SVG.</p>
</div>
