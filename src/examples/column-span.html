<div class="card cols">
  <p>Fog sat on the bay at six.</p>
  <p>The tide was low, and the boats lay still on wet sand.</p>
  <p>A gull stood guard on a post and watched the shore.</p>
  <h3 id="example-element">Tide table</h3>
  <p>By ten the sun was up and the sea came in fast.</p>
  <p>Kids ran out to count each wave as it broke.</p>
  <p>At dusk the lamps came on and the quay went quiet.</p>
</div>
