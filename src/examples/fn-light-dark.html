<div id="example-element">
  <div class="col light">
    <b>Light scope</b>
    <span>color-scheme: light</span>
  </div>
  <div class="col dark">
    <b>Dark scope</b>
    <span>color-scheme: dark</span>
  </div>
</div>
<p class="cap">Each column forces its own <code>color-scheme</code>, so both results show at once. Anywhere else, <code>light-dark()</code> follows the colour scheme the element has.</p>
