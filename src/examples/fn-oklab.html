<div id="example-element" class="card">
  <div class="swatch"></div>
  <div class="row">
    <i style="background: oklab(from currentColor 0.92 a b)"></i>
    <i style="background: oklab(from currentColor 0.78 a b)"></i>
    <i style="background: oklab(from currentColor 0.64 a b)"></i>
    <i style="background: oklab(from currentColor 0.5 a b)"></i>
    <i style="background: oklab(from currentColor 0.36 a b)"></i>
    <i style="background: oklab(from currentColor 0.22 a b)"></i>
  </div>
  <div class="row">
    <i style="background: oklab(from currentColor l calc(a * 0) calc(b * 0))"></i>
    <i style="background: oklab(from currentColor l calc(a * 0.2) calc(b * 0.2))"></i>
    <i style="background: oklab(from currentColor l calc(a * 0.4) calc(b * 0.4))"></i>
    <i style="background: oklab(from currentColor l calc(a * 0.6) calc(b * 0.6))"></i>
    <i style="background: oklab(from currentColor l calc(a * 0.8) calc(b * 0.8))"></i>
    <i style="background: oklab(from currentColor l calc(a * 1) calc(b * 1))"></i>
  </div>
  <p class="cap">Top: the chosen value. Row 1: <code>oklab(from currentColor 0.92 a b)</code> down to <code>0.22</code>. Row 2: <code>oklab(from currentColor l calc(a * 0.2) calc(b * 0.2))</code>, scaling a and b from 0 to 1.</p>
</div>
