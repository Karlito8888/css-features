<div id="example-element" class="card">
  <div class="swatch"></div>
  <div class="row">
    <i style="background: oklch(from currentColor 0.95 c h)"></i>
    <i style="background: oklch(from currentColor 0.8 c h)"></i>
    <i style="background: oklch(from currentColor 0.65 c h)"></i>
    <i style="background: oklch(from currentColor 0.5 c h)"></i>
    <i style="background: oklch(from currentColor 0.35 c h)"></i>
    <i style="background: oklch(from currentColor 0.2 c h)"></i>
  </div>
  <div class="row">
    <i style="background: oklch(from currentColor l c calc(h + 0))"></i>
    <i style="background: oklch(from currentColor l c calc(h + 60))"></i>
    <i style="background: oklch(from currentColor l c calc(h + 120))"></i>
    <i style="background: oklch(from currentColor l c calc(h + 180))"></i>
    <i style="background: oklch(from currentColor l c calc(h + 240))"></i>
    <i style="background: oklch(from currentColor l c calc(h + 300))"></i>
  </div>
  <p class="cap">Top: the chosen value. Row 1: <code>oklch(from currentColor 0.95 c h)</code> down to <code>0.2</code>. Row 2: <code>oklch(from currentColor l c calc(h + 60))</code>, the hue moved by 0 to 300 degrees.</p>
</div>
