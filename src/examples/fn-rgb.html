<div id="example-element" class="card">
  <div class="swatch"></div>
  <div class="row four">
    <i style="background: rgb(from currentColor r 0 0)"></i>
    <i style="background: rgb(from currentColor 0 g 0)"></i>
    <i style="background: rgb(from currentColor 0 0 b)"></i>
    <i style="background: rgb(from currentColor calc(255 - r) calc(255 - g) calc(255 - b))"></i>
  </div>
  <p class="cap">Top: the chosen value. Below: its red, green and blue channels alone (<code>rgb(from currentColor r 0 0)</code> and so on), then the inverse (<code>255 - r</code>).</p>
</div>
