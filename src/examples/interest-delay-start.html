<form class="card" action="#">
  <div class="label">
    <label for="iban">IBAN</label>
    <button type="button" id="example-element" interestfor="tip-iban" aria-label="What is an IBAN?">?</button>
  </div>
  <input id="iban" name="iban" placeholder="FR76 3000 6000 0112 3456 7890 189">
  <div id="tip-iban" popover="hint">Your international bank account number, printed on your bank statement.</div>
</form>
<p class="cap">Rest the pointer on the ? and the tooltip waits for the start delay. With <code>2s</code>, sweep across it quickly and nothing opens; with <code>0s</code> it opens on contact. Chrome only.</p>
