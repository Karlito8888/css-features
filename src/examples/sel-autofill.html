<form id="example-element" class="card">
  <label class="row">Name <input type="text" name="name" autocomplete="name"></label>
  <label class="row">Email <input type="email" name="email" autocomplete="email"></label>
  <label class="row">Phone <input type="tel" name="phone" autocomplete="tel"></label>
  <label class="row">Address <input type="text" name="address" autocomplete="address-line1"></label>
</form>
<p class="cap">Matches only when your browser fills a field from saved data (name, email, phone, address). With nothing saved, or before you accept a suggestion, nothing changes.</p>
