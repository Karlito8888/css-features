<form id="example-element" class="card">
  <fieldset>
    <legend>Notify me</legend>
    <label class="opt"><input type="checkbox" checked><span>Replies</span></label>
    <label class="opt"><input type="checkbox"><span>Mentions</span></label>
    <label class="opt"><input type="checkbox" checked><span>Releases</span></label>
  </fieldset>
  <fieldset>
    <legend>Plan</legend>
    <label class="opt"><input type="radio" name="plan"><span>Free</span></label>
    <label class="opt"><input type="radio" name="plan" checked><span>Pro</span></label>
  </fieldset>
  <label class="row wide">Languages <select size="3" multiple>
    <option selected>English</option>
    <option>Filipino</option>
    <option selected>Spanish</option>
  </select></label>
</form>
