<ul id="example-element" class="card">
  <li><code>dir="ltr"</code><p dir="ltr">Welcome back</p></li>
  <li><code>dir="rtl"</code><p dir="rtl">مرحبًا بعودتك</p></li>
  <li><code>dir="auto"</code><p dir="auto">Good morning</p></li>
  <li><code>dir="auto"</code><p dir="auto">בוקר טוב</p></li>
</ul>
<p class="cap"><code>:dir()</code> matches the resolved direction, not the attribute: the two <code>dir="auto"</code> lines resolve from their first strong letter.</p>
