<form id="example-element" class="card">
  <fieldset>
    <legend>Account</legend>
    <div class="row"><label for="fw-name">Name</label><input id="fw-name" type="text"></div>
    <div class="row"><label for="fw-mail">Email</label><input id="fw-mail" type="email"></div>
  </fieldset>
  <fieldset>
    <legend>Billing</legend>
    <div class="row"><label for="fw-card">Card</label><input id="fw-card" type="text" inputmode="numeric"></div>
  </fieldset>
</form>
<p class="cap">Click or <code>Tab</code> into a field: its row, its group and the whole form all contain the focus.</p>
