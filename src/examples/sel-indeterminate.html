<form id="example-element" class="card">
  <fieldset>
    <legend>T-shirt size</legend>
    <div class="bar">
      <label class="opt"><input type="radio" name="size"><span>S</span></label>
      <label class="opt"><input type="radio" name="size"><span>M</span></label>
      <label class="opt"><input type="radio" name="size"><span>L</span></label>
    </div>
  </fieldset>
  <fieldset>
    <legend>Colour</legend>
    <div class="bar">
      <label class="opt"><input type="radio" name="colour"><span>Ink</span></label>
      <label class="opt"><input type="radio" name="colour" checked><span>Sand</span></label>
    </div>
  </fieldset>
  <label class="row">Upload <progress></progress></label>
  <label class="opt"><input type="checkbox"><span>Gift wrap</span></label>
</form>
<p class="cap">A radio group with nothing checked is indeterminate, so is a progress bar without a value. A checkbox only gets there through script.</p>
