<figure id="example-element" class="card">
  <figcaption>Visits by channel, this week</figcaption>
  <div class="bars">
    <div class="bar" id="search" data-value="4.2k" style="--h: 84%"></div>
    <div class="bar" id="social" data-value="2.9k" style="--h: 58%"></div>
    <div class="bar" id="email" data-value="1.6k" style="--h: 32%"></div>
    <div class="bar" id="direct" data-value="3.4k" style="--h: 68%"></div>
  </div>
  <div class="legend">
    <button type="button" interestfor="search">Search</button>
    <button type="button" interestfor="social">Social</button>
    <button type="button" interestfor="email">Email</button>
    <button type="button" interestfor="direct">Direct</button>
  </div>
</figure>
<p class="cap">Hover a channel in the legend, or reach it with Tab, and wait a moment. Its bar is the interest target and matches <code>:interest-target</code>. Chrome only.</p>
