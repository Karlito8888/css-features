<div id="example-element" class="card">
  <p lang="en"><code>en</code> Welcome</p>
  <p lang="en-GB"><code>en-GB</code> Cheers</p>
  <p lang="fr"><code>fr</code> Bonjour</p>
  <p lang="fr-CA"><code>fr-CA</code> Bienvenue</p>
  <p lang="ja"><code>ja</code> ようこそ</p>
  <p lang="ar" dir="rtl"><code dir="ltr">ar</code> مرحبًا بكم</p>

<p class="cap">Each line carries its own <code>lang</code> attribute. A language also matches its regional variants: <code>en</code> covers <code>en-GB</code>, <code>fr</code> covers <code>fr-CA</code>.</p>
