<form id="example-element" class="card">
  <div class="row"><label for="rq-name">Name</label><input id="rq-name" type="text" required></div>
  <div class="row"><label for="rq-mail">Email</label><input id="rq-mail" type="email" required></div>
  <div class="row"><label for="rq-co">Company</label><input id="rq-co" type="text"></div>
  <div class="row"><label for="rq-topic">Topic</label><select id="rq-topic" required><option value="">Choose</option><option>Billing</option><option>Support</option></select></div>
  <div class="row"><label for="rq-msg">Message</label><textarea id="rq-msg" rows="2"></textarea></div>
  <label class="opt"><input type="checkbox"> Send me tips</label>
  <label class="opt"><input type="checkbox" required> I accept the terms</label>
</form>
