<div id="example-element" class="card">
  <p class="line">Quarterly report</p>
  <p class="sub">Edited 2 minutes ago</p>
  <button type="button" popovertarget="share">Share</button>
  <div id="share" popover>
    <b>Share this report</b>
    <span>Copy link</span>
    <span>Send by email</span>
  </div>
</div>
<p class="cap">Click Share to open the popover, then click outside it or press Esc to close it. While it is open it matches <code>:popover-open</code>.</p>
