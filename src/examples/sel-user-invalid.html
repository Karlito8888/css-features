<form id="example-element" class="card">
  <label class="row">Email <input type="email" required><small>Enter an email address</small></label>
  <label class="row">Password <input type="password" required minlength="8"><small>At least 8 characters</small></label>
  <label class="row">Username <input type="text" pattern="[a-z0-9_]{3,12}"><small>Letters, digits and _, 3 to 12</small></label>
  <button type="submit">Create account</button>
</form>
<p class="cap">Type a wrong value (an email without <code>@</code>, a short password) and press <code>Tab</code>, or press Create account on empty fields. A field only flags itself after you have interacted with it.</p>
