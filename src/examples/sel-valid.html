<form id="example-element" class="card">
  <fieldset>
    <legend>Account</legend>
    <label class="row">Name <input type="text" value="Ana Reyes" required><small>Looks good</small></label>
    <label class="row">Email <input type="email" value="ana.mail.com" required><small>Looks good</small></label>
    <label class="row">Website <input type="text" inputmode="url" pattern="https?://.+" value="example.com"><small>Looks good</small></label>
  </fieldset>
  <fieldset>
    <legend>Extras</legend>
    <label class="row">Company <input type="text"><small>Looks good</small></label>
    <label class="row">Nickname <input type="text" value="ana" pattern="[a-z]+"><small>Looks good</small></label>
  </fieldset>
  <button type="submit">Create account</button>
</form>
