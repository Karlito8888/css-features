<p class="cap">Every gradient runs from <code>var(--a1)</code> to <code>var(--a4)</code>. The <code>in ...</code> part is the <code>&lt;color-interpolation-method&gt;</code>: it names the colour space the blend runs through, and for a polar space like oklch or hsl, how the hue travels.</p>
