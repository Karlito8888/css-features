<p class="cap">Hue is a circle, so a blend between two hues has two ways round. The <code>&lt;hue-interpolation-method&gt;</code> (<code>shorter</code>, <code>longer</code>, <code>increasing</code> or <code>decreasing</code>, then <code>hue</code>) picks one. Here: <code>var(--a1)</code> to <code>var(--a2)</code>, then <code>var(--a3)</code> to <code>var(--a4)</code>.</p>
