<div class="demo-ac">
  <fieldset class="controls">
    <legend>align-content</legend>
    <label><input type="radio" name="ac" id="ac-start"> start</label>
    <label><input type="radio" name="ac" id="ac-center" checked> center</label>
    <label><input type="radio" name="ac" id="ac-end"> end</label>
  </fieldset>
  <p class="hint">The box below is a plain block. No flex, no grid. Drag its bottom-right corner to change its height.</p>
  <div class="box">
    <h2>Aligned in a block</h2>
    <p>This text sits in a normal <code>div</code>. The box decides where its content goes.</p>
  </div>
  <p class="unsupported">Block layout alignment is not supported in this browser, so the content stays at the top.</p>
</div>
