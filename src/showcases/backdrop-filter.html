<div class="demo-bf">
  <p class="unsupported">Your browser does not support backdrop-filter, so the card below is plain translucent white.</p>
  <div class="scene">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <p class="word" aria-hidden="true">BEHIND THE GLASS</p>
    <article class="glass">
      <h2>Frosted glass</h2>
      <p>The blob and the big letters behind this card are blurred. The card itself stays sharp.</p>
    </article>
  </div>
  <div class="controls">
    <div class="ctl"><label for="blur">Blur</label> <input type="range" id="blur" min="0" max="30" value="14"> <output id="blur-out" for="blur">14px</output></div>
    <div class="ctl"><label for="sat">Saturate</label> <input type="range" id="sat" min="50" max="250" value="160"> <output id="sat-out" for="sat">160%</output></div>
  </div>
</div>
