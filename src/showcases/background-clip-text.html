<div class="demo-text">
  <p class="unsupported">background-clip: text is not supported in this browser. The headline keeps a solid color.</p>
  <h2 class="headline" id="headline">Paint with gradients</h2>
  <fieldset class="presets">
    <legend>Background</legend>
    <label><input id="g-aurora" type="radio" name="g" checked> Aurora</label>
    <label><input id="g-sunset" type="radio" name="g"> Sunset</label>
    <label><input id="g-ocean" type="radio" name="g"> Ocean</label>
    <label><input id="g-stripes" type="radio" name="g"> Stripes</label>
  </fieldset>
  <p class="field">
    <label for="words">Your headline</label>
    <input id="words" type="text" value="Paint with gradients" maxlength="40">
  </p>
</div>
