<div class="demo-cap">
  <p class="unsupported" role="status">This browser does not support the <code>cap</code> unit. The icons below keep a fixed size.</p>
  <div class="controls">
    <fieldset>
      <legend>Font</legend>
      <label><input type="radio" name="face" id="f-sans" checked> Sans</label>
      <label><input type="radio" name="face" id="f-serif"> Serif</label>
      <label><input type="radio" name="face" id="f-mono"> Mono</label>
    </fieldset>
    <label class="size" for="size">Size</label> <input type="range" id="size" min="14" max="48" value="32"> <output id="size-out" for="size">32px</output>
    <label class="toggle"><input type="checkbox" id="guides" checked> Show icon boxes</label>
  </div>
  <div class="stage">
    <section class="row em">
      <h2>height: 1em</h2>
      <p class="labels">
        <span class="tag"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 3.5h6V0l4 5-4 5V6.5H0z"/></svg>NEXT</span>
        <span class="tag"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M4 0h2v4h4v2H6v4H4V6H0V4h4z"/></svg>ADD</span>
        <span class="tag"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 6l1.6-1.6L4 6.8 8.4 0 10 1.2 4 10z"/></svg>DONE</span>
      </p>
    </section>
    <section class="row cap">
      <h2>height: 1cap</h2>
      <p class="labels">
        <span class="tag"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 3.5h6V0l4 5-4 5V6.5H0z"/></svg>NEXT</span>
        <span class="tag"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M4 0h2v4h4v2H6v4H4V6H0V4h4z"/></svg>ADD</span>
        <span class="tag"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 6l1.6-1.6L4 6.8 8.4 0 10 1.2 4 10z"/></svg>DONE</span>
      </p>
    </section>
  </div>
</div>
