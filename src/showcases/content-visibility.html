<div class="cv">
  <p class="unsupported" role="note">Your browser does not support content-visibility. All the cards are always rendered.</p>
  <h1 class="cv-title">A list of 600 cards</h1>
  <div class="cv-bar">
    <label class="cv-toggle"><input type="checkbox" id="cv-toggle" checked> <code>content-visibility: auto</code></label>
    <p class="cv-status">Rendered: <strong id="cv-count">0</strong> of <span id="cv-total">0</span>. Layout of all cards: <strong id="cv-time" aria-live="polite">0 ms</strong>.</p>
  </div>
  <div class="cv-scroller" tabindex="0" role="region" aria-label="Scrollable list of cards">
    <ol class="cv-list" id="cv-list"></ol>
  </div>
</div>
