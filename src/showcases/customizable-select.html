<div class="demo-select">
  <p class="unsupported" role="note">Customizable select (appearance: base-select) is not supported in this browser, so the plain native select is shown.</p>
  <div class="field">
    <label for="theme">Theme color</label>
    <select id="theme" name="theme">
      <button type="button"><selectedcontent></selectedcontent></button>
      <option value="indigo" selected><span class="swatch indigo" aria-hidden="true"></span>Indigo</option>
      <option value="rose"><span class="swatch rose" aria-hidden="true"></span>Rose</option>
      <option value="teal"><span class="swatch teal" aria-hidden="true"></span>Teal</option>
      <option value="amber"><span class="swatch amber" aria-hidden="true"></span>Amber</option>
      <option value="slate"><span class="swatch slate" aria-hidden="true"></span>Slate</option>
    </select>
  </div>
  <p class="hint">Open the menu: the picker, the options and the checkmark are all plain CSS.</p>
  <article class="card">
    <h2>Preview</h2>
    <p>The card follows the selected option.</p>
    <span class="pill">Selected</span>
  </article>
</div>
