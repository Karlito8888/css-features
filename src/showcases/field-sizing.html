<div class="demo-fs">
  <p class="unsupported" role="note">field-sizing is not supported in this browser, so the fields keep their fixed size.</p>
  <fieldset class="mode">
    <legend>field-sizing</legend>
    <label><input type="radio" name="mode" id="mode-content" checked> content</label>
    <label><input type="radio" name="mode" id="mode-fixed"> fixed</label>
  </fieldset>
  <p class="hint">Type in the fields. They grow with the text, no script.</p>
  <p class="sentence">
    <label>Hi, my name is <input type="text" class="inline" placeholder="your name"></label>
  </p>
  <p class="sentence">
    <label>and I am learning <input type="text" class="inline" placeholder="a topic"></label>
  </p>
  <div class="chat">
    <label for="message">Message</label>
    <textarea id="message" rows="2">Hello!</textarea>
  </div>
</div>
