<div class="demo-fsa">
  <p class="unsupported" role="status">This browser does not support <code>font-size-adjust</code>. Both lines keep the same font size, so the serif looks smaller.</p>
  <fieldset class="modes">
    <legend>font-size-adjust</legend>
    <label><input type="radio" name="mode" id="m-none" checked> none</label>
    <label><input type="radio" name="mode" id="m-ex"> ex-height 0.545</label>
    <label><input type="radio" name="mode" id="m-cap"> cap-height 0.73</label>
  </fieldset>
  <p class="hint">Both lines are 40px. The coloured bar is the height of the letter x (or of a capital H) in that font.</p>
  <div class="stage">
    <div class="row sans">
      <p class="label">Sans, Verdana-like</p>
      <p class="line"><span class="bar" aria-hidden="true"></span>Hex wax box</p>
    </div>
    <div class="row serif">
      <p class="label">Serif, Times-like</p>
      <p class="line"><span class="bar" aria-hidden="true"></span>Hex wax box</p>
    </div>
  </div>
</div>
