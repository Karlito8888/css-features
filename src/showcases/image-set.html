<div class="demo-set">
  <p class="unsupported">image-set() is not supported in this browser. The picture boxes below stay empty.</p>
  <p class="status">Screen density: <output id="dpr">1x</output>. Zoom the page with Ctrl and plus (or minus) to change it.</p>
  <div class="row">
    <figure>
      <div class="art picked" role="img" aria-label="Picture chosen by the browser from the set"></div>
      <figcaption><code>image-set()</code> with both images: the browser picks</figcaption>
    </figure>
    <figure>
      <div class="art only-1x" role="img" aria-label="The 1x picture alone"></div>
      <figcaption>The 1x image alone</figcaption>
    </figure>
    <figure>
      <div class="art only-2x" role="img" aria-label="The 2x picture alone"></div>
      <figcaption>The 2x image alone</figcaption>
    </figure>
  </div>
</div>
