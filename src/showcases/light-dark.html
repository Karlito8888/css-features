<div class="demo-ld">
  <p class="unsupported">Your browser does not support light-dark(), so the card below stays unstyled.</p>
  <label class="switch">
    <input type="checkbox" id="dark" role="switch">
    <span class="track" aria-hidden="true"></span>
    Dark scheme
  </label>

  <article class="card">
    <h2>Weekly report</h2>
    <p>Every color here is written once, as a light value and a dark value. Flip the switch: only <code>color-scheme</code> changes.</p>
    <ul class="chips">
      <li class="a">light-dark(#fff, #14161c)</li>
      <li class="b">light-dark(#4338ca, #a5b4fc)</li>
    </ul>
    <div class="native">
      <label>Name <input type="text" value="Ada"></label>
      <button type="button">Save</button>
    </div>
  </article>
</div>
