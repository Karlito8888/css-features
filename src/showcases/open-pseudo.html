<div class="demo-open">
  <p class="unsupported" role="status">This browser does not support :open, so the cards below never show the open state.</p>
  <p class="hint">Open each control. Its card lights up and the badge follows the state.</p>
  <div class="grid">
    <section class="card" aria-labelledby="c1">
      <h2 id="c1">details</h2>
      <details>
        <summary>Shipping times</summary>
        <p>Orders leave the warehouse within two working days.</p>
      </details>
    </section>

    <section class="card" aria-labelledby="c2">
      <h2 id="c2">select</h2>
      <label for="fruit" class="sr">Fruit</label>
      <select id="fruit">
        <option>Apple</option>
        <option>Banana</option>
        <option>Cranberry</option>
        <option>Fig</option>
      </select>
    </section>

    <section class="card" aria-labelledby="c3">
      <h2 id="c3">input</h2>
      <label for="day" class="sr">Day</label>
      <input id="day" type="date" value="2026-11-05">
    </section>

    <section class="card" aria-labelledby="c4">
      <h2 id="c4">dialog</h2>
      <button type="button" id="toggle">Toggle the dialog</button>
      <dialog id="note">
        <p>Hello from a dialog.</p>
        <form method="dialog"><button>Close</button></form>
      </dialog>
    </section>
  </div>
</div>
