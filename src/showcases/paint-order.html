<div class="demo-paint">
  <p class="unsupported">paint-order is not supported in this browser. Both columns paint the stroke over the fill.</p>
  <div class="controls">
    <label for="w">Stroke width</label>
    <input id="w" type="range" min="0" max="30" step="1" value="14">
    <output id="wv" for="w">14</output>
  </div>
  <div class="grid">
    <figure>
      <div class="cell">
        <svg viewBox="0 0 320 120" role="img" aria-label="The word Paint, stroke painted over the fill">
          <text x="160" y="90" text-anchor="middle">Paint</text>
        </svg>
      </div>
      <figcaption>SVG text, <code>normal</code></figcaption>
    </figure>
    <figure>
      <div class="cell first">
        <svg viewBox="0 0 320 120" role="img" aria-label="The word Paint, stroke painted under the fill">
          <text x="160" y="90" text-anchor="middle">Paint</text>
        </svg>
      </div>
      <figcaption>SVG text, <code>stroke fill</code></figcaption>
    </figure>
    <figure>
      <div class="cell"><p class="html">Paint</p></div>
      <figcaption>HTML text, <code>normal</code></figcaption>
    </figure>
    <figure>
      <div class="cell first"><p class="html">Paint</p></div>
      <figcaption>HTML text, <code>stroke fill</code></figcaption>
    </figure>
  </div>
</div>
