<div class="demo-prop">
  <p class="unsupported">This browser does not support @property, so both cards behave the same.</p>
  <p class="hint">Hover or focus each card. Only the registered property animates.</p>
  <div class="pair">
    <div class="ring registered" tabindex="0">
      <div class="inner">
        <strong>Registered</strong>
        <span class="note">--angle is an &lt;angle&gt;</span>
        <span class="stat"></span>
      </div>
    </div>
    <div class="ring plain" tabindex="0">
      <div class="inner">
        <strong>Not registered</strong>
        <span class="note">--turn is plain text</span>
        <span class="stat"></span>
      </div>
    </div>
  </div>
</div>
