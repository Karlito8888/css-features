<div class="demo-textbox">
  <p class="unsupported" role="status">This browser does not support <code>text-box</code>. Both columns look the same.</p>
  <div class="pair">
    <section class="col">
      <h2>text-box: normal</h2>
      <p class="tb big">NEXT</p>
      <button type="button" class="tb btn">Continue</button>
    </section>
    <section class="col col-trim">
      <h2>text-box: trim-both cap alphabetic</h2>
      <p class="tb big">NEXT</p>
      <button type="button" class="tb btn">Continue</button>
    </section>
  </div>
  <p class="note">Same padding on both sides. The pink band is the text box.</p>
</div>
