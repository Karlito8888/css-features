<div class="demo-trig">
  <p class="unsupported">This browser does not support sin(), cos() and atan2(), so the dots stay stacked in the middle.</p>
  <p class="hint">Drag the angle to turn the ring and the wave. Move the pointer over the ring: the arrow follows it.</p>
  <div class="controls">
    <label for="rot">Angle</label>
    <input type="range" id="rot" min="0" max="360" value="0">
    <output id="out" for="rot">0deg</output>
  </div>
  <div class="ring" id="ring" aria-hidden="true">
    <span class="arrow"></span>
    <span class="dot" style="--i: 0"></span>
    <span class="dot" style="--i: 1"></span>
    <span class="dot" style="--i: 2"></span>
    <span class="dot" style="--i: 3"></span>
    <span class="dot" style="--i: 4"></span>
    <span class="dot" style="--i: 5"></span>
    <span class="dot" style="--i: 6"></span>
    <span class="dot" style="--i: 7"></span>
    <span class="dot" style="--i: 8"></span>
    <span class="dot" style="--i: 9"></span>
    <span class="dot" style="--i: 10"></span>
    <span class="dot" style="--i: 11"></span>
  </div>
  <div class="wave" aria-hidden="true">
    <span style="--i: 0"></span><span style="--i: 1"></span><span style="--i: 2"></span><span style="--i: 3"></span><span style="--i: 4"></span><span style="--i: 5"></span><span style="--i: 6"></span><span style="--i: 7"></span><span style="--i: 8"></span><span style="--i: 9"></span><span style="--i: 10"></span><span style="--i: 11"></span><span style="--i: 12"></span><span style="--i: 13"></span><span style="--i: 14"></span><span style="--i: 15"></span><span style="--i: 16"></span><span style="--i: 17"></span><span style="--i: 18"></span><span style="--i: 19"></span>
  </div>
</div>
